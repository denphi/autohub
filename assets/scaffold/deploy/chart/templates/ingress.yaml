{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "autohub.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Release.Name }}-ingress-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web
                port:
                  # http by default: controllers that terminate TLS forward
                  # plain HTTP, and Apache's :443 answers that with 400.
                  # Accept a number as well as a name -- rendering `443` as a
                  # port *name* produces an Ingress the API server rejects on
                  # IANA_SVC_NAME validation, with no hint about why.
                  {{- $backend := .Values.ingress.backendPort | default "http" | toString }}
                  {{- if regexMatch "^[0-9]+$" $backend }}
                  number: {{ $backend | int }}
                  {{- else }}
                  name: {{ $backend | quote }}
                  {{- end }}
{{- end }}
