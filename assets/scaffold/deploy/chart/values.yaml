# autohub Helm values. Mirrors docker-compose.yml's env/topology so the same
# image and the same first-boot entrypoint run unchanged on a cluster.
#
# Secrets are read from an existing Secret (see `secret.existingSecret`) or,
# for a quick start, from `secret.data` below — never commit real values there.

image:
  repository: autohub/hubzero
  tag: latest
  pullPolicy: IfNotPresent

# Non-secret hub environment (the compose x-hub-env block, minus passwords).
env:
  HUB_ROOT: /var/www/html
  HUBZERO_REPO: https://github.com/hubzero/hubzero-cms.git
  HUBZERO_REF: 2.4-main
  HUBZERO_AUTO_UPDATE: "0"
  DB_HOST: "" # defaulted to <release>-db in _helpers if left empty
  DB_PORT: "3306"
  DB_NAME: hubzero
  DB_USER: hubzero
  DB_PREFIX: jos_
  HUB_SITENAME: AutoHub
  HUB_ENV: production
  HUB_DEBUG: "0"
  HUB_ERROR_REPORTING: none
  HUB_TIMEZONE: UTC
  HUB_FORCE_SSL: "0"
  HUB_TLS_CN: localhost
  HUB_ADMIN_USER: admin
  HUB_ADMIN_EMAIL: admin@example.com
  HUB_ADMIN_NAME: Administrator
  HUB_LOAD_SAMPLE_DATA: "0"
  HUB_MAILER: smtp
  HUB_MAIL_FROM: hub@example.com
  HUB_MAIL_FROMNAME: AutoHub
  HUB_SMTP_HOST: "" # defaulted to <release>-mail if left empty
  HUB_SMTP_PORT: "1025"
  HUB_SMTP_SECURE: none
  HUB_SMTP_AUTH: "0"
  HUB_SMTP_USER: ""

# Secret material. Prefer existingSecret in real deployments.
secret:
  existingSecret: ""      # name of a pre-created Secret with the keys below
  data:                   # used only if existingSecret is empty
    DB_PASSWORD: ""
    DB_ROOT_PASSWORD: ""
    HUB_SECRET: ""
    HUB_ADMIN_PASSWORD: ""
    HUB_SMTP_PASSWORD: ""

# hub.yml — the declarative hub. Pasted into a ConfigMap and mounted at
# /etc/hubzero/hub.yml (read-only), exactly as compose bind-mounts it.
hubManifest: |
  # site: My Hub

# Defaults are sized from a measured running hub (hub_src ~1.1Gi, hub_app a few
# Mi + uploads, database ~155Mi) so they fit a real, modest namespace quota.
# With everything below enabled the chart asks for 8256Mi of requests.storage
# (src 3Gi + app 2Gi + tls 64Mi + db 3Gi; +10Gi if backup.enabled) and
# 1.7 CPU / ~4.6Gi of limits: web 1/3Gi, cron 200m/512Mi, db 400m/1Gi, mail
# 100m/128Mi. CPU is the binding constraint in practice -- a Geddes namespace
# granted 10000Mi of storage and 8Gi of memory but still only **2 CPU**, which
# a 4-CPU chart exceeds on that axis alone.
#
# Tune per environment with `values_files:` in autohub.yml, never by editing
# the chart in place.
#
# UPGRADING an existing release: these storage sizes are SMALLER than the
# chart's earlier defaults. Kubernetes never shrinks a PVC and a StatefulSet's
# volumeClaimTemplates are immutable, so a release installed with the old sizes
# must pin them or `helm upgrade` fails. Set
# `values_files: deploy/existing-release-storage.yaml` in autohub.yml; that
# file ships with the previous sizes. Growing tls 16Mi -> 64Mi additionally
# needs allowVolumeExpansion on the storage class.
web:
  replicas: 1             # HUBzero sessions/uploads are not share-nothing; keep 1
  cron:
    enabled: true         # runs hub-cron as a sidecar sharing the web volumes
    interval: "60"
    # Explicit resources: a container without them gets the namespace
    # LimitRange default (32Mi on some clusters), which OOM-kills the PHP
    # cron loop on every tick.
    resources:
      requests: { cpu: "50m",  memory: "128Mi" }
      limits:   { cpu: "200m", memory: "512Mi" }
  resources:
    requests: { cpu: "250m", memory: "768Mi" }
    limits:   { cpu: "1",    memory: "3Gi" }
  storage:
    src: { size: 3Gi }    # the CMS checkout (hub_src; ~1.1Gi measured)
    app: { size: 2Gi }    # config, uploads, logs, cache, sessions (hub_app)
    tls: { size: 64Mi }   # certs (hub_tls)
    storageClassName: ""  # "" = cluster default

db:
  image: mariadb:10.11
  storage:
    size: 3Gi             # ~155Mi measured on a content-rich hub
    storageClassName: ""
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits:   { cpu: "400m", memory: "1Gi" }

mail:
  enabled: true           # in-cluster mailpit sink (compose parity)
  image: axllent/mailpit:latest
  # Explicit resources for the same LimitRange reason as web.cron above.
  resources:
    requests: { cpu: "25m",  memory: "64Mi" }
    limits:   { cpu: "100m", memory: "128Mi" }

# Recurring database backup (CronJob). hub-backup dumps over the network, so
# this needs only DB access + its own volume — no conflict with the web pod's
# RWO app volume. Toggle/schedule/retention are driven from autohub.yml.
backup:
  enabled: false
  schedule: "0 3 * * *"   # daily at 03:00 (cluster time)
  keep: 7                 # retain the newest N dumps, prune older
  storage:
    size: 10Gi
    storageClassName: ""
  # Explicit resources for the same LimitRange reason as web.cron and mail: a
  # mysqldump piped through gzip at a 32Mi namespace default is OOM-killed
  # every night, and on a quota that requires limits the pod fails admission
  # so no backup is ever taken.
  resources:
    requests: { cpu: "50m",  memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

service:
  type: ClusterIP

ingress:
  enabled: false
  className: ""
  host: ""                # must match kubernetes.ingress_host in autohub.yml
  tls: true
  # Service port the controller forwards to. Most controllers terminate TLS
  # themselves and forward plain HTTP; pointing them at the pod's https port
  # yields "400 You're speaking plain HTTP to an SSL-enabled server port" on
  # every route while the pod itself is healthy. The vhost turns
  # X-Forwarded-Proto into HTTPS=on, so the plain-http backend is the correct
  # default, not a compromise. Set to "https" only for a controller that
  # re-encrypts to the backend.
  backendPort: http
  # Enforce HTTPS at the controller: HUBzero's own force_ssl covers parts of
  # the admin flow, not the site, so without this the whole front end is
  # served over plain HTTP with no redirect.
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
