# Server-scope rules shared by the HTTP and HTTPS vhosts.
#
# HUBzero routes every request through the single front controller at
# /index.php. "/administrator" and "/api" are URL segments consumed by
# Hubzero\Base\ClientDetector, NOT directories on disk -- there is nothing to
# alias, only to rewrite.

<Directory /var/www/html>
	Options -Indexes +FollowSymLinks
	# All rules live here rather than in .htaccess: one less file to keep in
	# sync with upstream, and Apache does not stat every directory per request.
	AllowOverride None
	Require all granted

	RewriteEngine On
	RewriteCond %{REQUEST_FILENAME} !-f
	RewriteCond %{REQUEST_FILENAME} !-d
	RewriteRule ^ index.php [L]
</Directory>

# --- Deny everything under app/ ---------------------------------------------
# app/ holds config (database credentials!), logs, caches, sessions and uploaded
# content. Uploads are served by the application, never directly.
<Directory /var/www/html/app>
	Require all denied
</Directory>

# ... except site templates, which are legitimately linked as /app/templates/...
<Directory /var/www/html/app/templates>
	Require all granted
</Directory>

# ... and except the media library. app/site/media is HUBzero's public media
# tree and the CMS links it directly as /app/site/media/... (production does the
# same), so denying it leaves visible holes in the page. Only static assets are
# opened up, and only under media/ -- the rest of app/site holds group, member
# and project uploads that the application streams through PHP after doing its
# own access checks, and must not be reachable by path.
<Directory /var/www/html/app/site/media>
	Require all denied

	<FilesMatch "(?i)\.(png|jpe?g|gif|webp|svg|ico|css|js|woff2?|ttf|eot|pdf)$">
		Require all granted
	</FilesMatch>
</Directory>

# ... and except compiled assets. Hubzero\Document\Assets compiles the
# template's LESS to app/cache/<client>/site.css and links to it directly, so
# denying it leaves the whole site unstyled. Only the build output is opened
# up: app/cache also holds page and query caches that must stay private.
<Directory /var/www/html/app/cache>
	Require all denied

	<FilesMatch "\.(css|js|map)$">
		Require all granted
	</FilesMatch>
</Directory>

# --- Deny the non-web parts of core/ ----------------------------------------
# core/assets, core/templates and core/{components,modules,plugins}/*/assets ARE
# referenced by the browser, so core/ cannot be denied wholesale.
<DirectoryMatch "^/var/www/html/core/(bin|bootstrap|libraries|migrations|vendor)(/|$)">
	Require all denied
</DirectoryMatch>

# --- Deny sensitive files anywhere ------------------------------------------
<FilesMatch "(?i)(^\.|^composer\.(json|lock)$|\.(sql|log|lock|bak|dist|sh|ini|yml|yaml|md)$)">
	Require all denied
</FilesMatch>

# --- Deny version control metadata anywhere ---------------------------------
# FilesMatch tests the *filename*, so the `^\.` above rejects a request for
# ".git" itself but not ".git/config" or ".git/HEAD", whose filenames are
# perfectly ordinary. A directory rule is the only thing that covers the
# contents. This is not hypothetical: app/templates is deliberately served, and
# LOCAL_TEMPLATE_PATH mounts a template straight from a working checkout, so a
# deployed template carries its .git with it. That is enough to reconstruct the
# entire repository -- every branch, every past revision -- over plain HTTP.
<DirectoryMatch "(?i)/\.(git|svn|hg|bzr)(/|$)">
	Require all denied
</DirectoryMatch>

<IfModule mod_deflate.c>
	AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript
	AddOutputFilterByType DEFLATE application/javascript application/json application/xml
</IfModule>

<IfModule mod_expires.c>
	ExpiresActive On
	ExpiresByType image/gif  "access plus 1 month"
	ExpiresByType image/jpeg "access plus 1 month"
	ExpiresByType image/png  "access plus 1 month"
	ExpiresByType image/webp "access plus 1 month"
	ExpiresByType image/svg+xml "access plus 1 month"
	ExpiresByType text/css   "access plus 1 week"
	ExpiresByType application/javascript "access plus 1 week"
</IfModule>
