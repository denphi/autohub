; Baseline PHP tuning for HUBzero. Override any of these at runtime with
; PHP_INI_* environment variables (handled by hub-render-php-ini).

memory_limit = 512M
max_execution_time = 300
max_input_vars = 5000
post_max_size = 128M
upload_max_filesize = 128M

expose_php = Off
date.timezone = UTC

; core/bootstrap/app.php reads PATH_CORE from $_ENV, which is only populated
; when "E" is present in variables_order.
variables_order = "EGPCS"

error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Hubzero\Base\Application::__destruct records request timings in APCu.
apc.enable_cli = 1

session.gc_maxlifetime = 2700
