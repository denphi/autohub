# Shared rules (rewrite, denies, compression) live in conf-available/hubzero-common.conf.

# HUBzero sets large cookies (session state, return-URL tracking, per-component
# hashes) that quickly add up to more than Apache's default 8 KB per-header
# limit -- the overflow returns "400 Bad Request: Size of a request header field
# exceeds server limit" and blocks the whole site. Production hubs raise this
# for the same reason. 32 KB comfortably fits a real HUBzero session.
LimitRequestFieldSize 32768
LimitRequestLine      32768

<VirtualHost *:80>
	DocumentRoot /var/www/html

	# Behind a reverse proxy or load balancer, honour the forwarded scheme so
	# the app sees a secure request. com_login checks $_SERVER['HTTPS']
	# directly, so without this the admin login redirect-loops forever.
	SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "SAMEORIGIN"
		Header always set Referrer-Policy "strict-origin-when-cross-origin"
		Header always unset X-Powered-By
	</IfModule>

	ErrorLog  /dev/stderr
	CustomLog /dev/stdout combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
	DocumentRoot /var/www/html

	SSLEngine on
	SSLCertificateFile    /etc/hubzero/tls/hub.crt
	SSLCertificateKeyFile /etc/hubzero/tls/hub.key

	SSLProtocol             -all +TLSv1.2 +TLSv1.3
	SSLHonorCipherOrder     off
	SSLSessionTickets       off

	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "SAMEORIGIN"
		Header always set Referrer-Policy "strict-origin-when-cross-origin"
		Header always unset X-Powered-By
		# Off by default: with a self-signed certificate on localhost, HSTS
		# pins the browser to a cert it will not accept. Enable it in
		# production, where the hostname has a real certificate.
		# Header always set Strict-Transport-Security "max-age=31536000"
	</IfModule>

	ErrorLog  /dev/stderr
	CustomLog /dev/stdout combined
</VirtualHost>
</IfModule>
